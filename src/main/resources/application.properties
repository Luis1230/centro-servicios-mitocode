quarkus.datasource.db-kind=mssql
quarkus.datasource.username=sa
quarkus.datasource.password=${DB_PASSWORD:Panda1997}

# Reactivo (Hibernate Reactive / Panache)
quarkus.datasource.reactive.url=sqlserver://localhost:1434/CentroServiciosDB
quarkus.datasource.reactive.trust-all=true

# JDBC (solo lo usa Flyway)
quarkus.datasource.jdbc.url=jdbc:sqlserver://localhost:1434;databaseName=CentroServiciosDB;encrypt=true;trustServerCertificate=true

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.database.default-schema=centroservicios

quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=centroservicios
quarkus.flyway.create-schemas=true